<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LinkedIn Message Scheduler</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="logo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="#0A66C2">
          <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
        </svg>
        <span>Message Scheduler</span>
      </div>
      <span class="badge" id="messageBadge">0 scheduled</span>
    </header>

    <div class="form-section">
      <h2 class="section-title">Schedule a Message</h2>

      <div class="form-group">
        <label for="recipientName">Recipient Name</label>
        <input type="text" id="recipientName" placeholder="e.g. Dolly Singh" />
      </div>

      <div class="form-group">
        <label for="profileUrl">LinkedIn Profile URL</label>
        <input type="url" id="profileUrl" placeholder="https://linkedin.com/in/username" />
      </div>

      <div class="form-group">
        <label for="messageText">Message</label>
        <textarea id="messageText" rows="4" placeholder="Hey, wanted to follow up on..."></textarea>
        <span class="char-count" id="charCount">0 / 300</span>
      </div>

      <div class="form-group">
        <label for="scheduledTime">Schedule Date & Time</label>
        <input type="datetime-local" id="scheduledTime" />
      </div>

      <button class="btn-primary" id="saveBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <polyline points="12 6 12 12 16 14"/>
        </svg>
        Schedule Message
      </button>

      <div class="toast" id="toast"></div>
    </div>

    <div class="list-section">
      <div class="list-header">
        <h2 class="section-title">Scheduled Messages</h2>
        <button class="btn-clear" id="clearAllBtn" style="display:none">Clear All</button>
      </div>
      <div id="messageList">
        <div class="empty-state">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#c8d6e0" stroke-width="1.5">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          </svg>
          <p>No messages scheduled yet.<br/>Add one above to get started.</p>
        </div>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
